name: Deploy site to GitHub Pages

# Publishes site/ to Pages. Manual, plus on changes to the site only, so
# source and docs commits don't trigger deploys.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/check-site-refs.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel an in-flight deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify site assets exist
        run: |
          set -e
          test -f site/index.html
          test -f site/assets/site.css
          test -f site/assets/favicon.svg
          test -f site/.nojekyll
          echo "site assets present"

      - name: Verify local asset references resolve
        run: python3 .github/scripts/check-site-refs.py

      - name: Verify the mark is well-formed SVG
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('site/assets/favicon.svg')"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
